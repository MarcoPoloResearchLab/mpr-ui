services:
  frontend:
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      pinguin-bootstrap:
        condition: service_completed_successfully
    environment:
      GHTTP_SERVE_PORT: "8000"
      GHTTP_SERVE_DIRECTORY: "/app/www"
      GHTTP_SERVE_PROXIES: "/auth=http://tauth:8080"
      GHTTP_SERVE_RESPONSE_HEADERS: "/=Cache-Control:no-store"
    ports:
      - "4443:8000"
    volumes:
      - ./index.html:/app/www/index.html:ro
      - ./mpr-ui.js:/app/www/mpr-ui.js:ro
      - ./mpr-ui.css:/app/www/mpr-ui.css:ro
      - ./mpr-ui-config.js:/app/www/mpr-ui-config.js:ro
      - ./README.md:/app/www/README.md:ro
      - ./ARCHITECTURE.md:/app/www/ARCHITECTURE.md:ro
      - ./CHANGELOG.md:/app/www/CHANGELOG.md:ro
      - ./demo/demo.js:/app/www/demo/demo.js:ro
      - ./demo/demo.css:/app/www/demo/demo.css:ro
      - ./demo/demo-user.svg:/app/www/demo/demo-user.svg:ro
      - ./demo/config-ui.yaml:/app/www/demo/config-ui.yaml:ro
      - ./demo/components.html:/app/www/demo/components.html:ro
      - ./demo/standalone.html:/app/www/demo/standalone.html:ro
      - ./demo/tauth-demo.html:/app/www/demo/tauth-demo.html:ro
      - ./demo/tauth-settings-modal.js:/app/www/demo/tauth-settings-modal.js:ro
      - ./demo/status-panel.js:/app/www/demo/status-panel.js:ro
      - ./demo/auth-provider-chooser.html:/app/www/demo/auth-provider-chooser.html:ro
      - ./demo/auth-provider-chooser.js:/app/www/demo/auth-provider-chooser.js:ro
      - ./demo/entity-workspace.html:/app/www/demo/entity-workspace.html:ro
      - ./demo/entity-workspace.js:/app/www/demo/entity-workspace.js:ro
      - ./demo/entity-workspace.css:/app/www/demo/entity-workspace.css:ro
      - ./demo/entity-workspace.json:/app/www/demo/entity-workspace.json:ro
      - ./docs/alpine.js.md:/app/www/docs/alpine.js.md:ro
      - ./docs/custom-elements.md:/app/www/docs/custom-elements.md:ro
      - ./docs/demo-index-auth.md:/app/www/docs/demo-index-auth.md:ro
      - ./docs/integration-guide.md:/app/www/docs/integration-guide.md:ro
    restart: unless-stopped

  tauth:
    build:
      context: ../tauth
      dockerfile: Dockerfile
    env_file:
      - ./demo/.env.tauth
    environment:
      TAUTH_CORS_ORIGIN_1: "http://localhost:4443"
      TAUTH_CORS_ORIGIN_2: "http://127.0.0.1:4443"
      TAUTH_CORS_ORIGIN_3: "http://computercat.tyemirov.net:4443"
      TAUTH_ALLOW_INSECURE_HTTP: "true"
      TAUTH_PASSWORD_USER_EMAIL: "demo@mprlab.local"
      TAUTH_PASSWORD_HASH: "$$2y$$12$$UihC9c7inwl90d3iKzlH3OPsrJn2OIGhgAT/TkOHbcueVdNrkf0zS"
      PINGUIN_DEMO_API_KEY: "${PINGUIN_DEMO_API_KEY}"
      PINGUIN_BOOTSTRAP_PASSWORD_HASH: "${PINGUIN_BOOTSTRAP_PASSWORD_HASH:?Set the private delivery owner bcrypt hash}"
      PINGUIN_BOOTSTRAP_SIGNING_KEY: "${PINGUIN_BOOTSTRAP_SIGNING_KEY:?Set a separate private delivery signing key}"
    depends_on:
      pinguin:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - tauth_data:/data
      - ./demo/tauth-config.yaml:/config.yaml:ro
    restart: unless-stopped

  pinguin:
    build:
      context: ../Pinguin
      dockerfile: Dockerfile
    env_file:
      - ../Pinguin/configs/.env.pinguin
    environment:
      TAUTH_SIGNING_KEY: "${PINGUIN_BOOTSTRAP_SIGNING_KEY:?Set a separate private delivery signing key}"
      TAUTH_COOKIE_NAME: "mpr_ui_delivery_session"
    volumes:
      - pinguin_data:/app/data
      - ../Pinguin/configs/config.pinguin.yml:/config/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  pinguin-bootstrap:
    image: python:3.13-alpine
    depends_on:
      tauth:
        condition: service_started
      pinguin:
        condition: service_healthy
    env_file:
      - ../Pinguin/configs/.env.pinguin
    environment:
      PINGUIN_DEMO_CREDENTIAL_ID: "${PINGUIN_DEMO_CREDENTIAL_ID}"
      PINGUIN_DEMO_CREDENTIAL_DIGEST: "${PINGUIN_DEMO_CREDENTIAL_DIGEST}"
      PINGUIN_BOOTSTRAP_PASSWORD: "${PINGUIN_BOOTSTRAP_PASSWORD:?Set the private delivery owner password}"
    volumes:
      - ./demo/bootstrap_pinguin.py:/app/bootstrap_pinguin.py:ro
    command: ["python", "/app/bootstrap_pinguin.py"]
    restart: "no"

volumes:
  tauth_data:
  pinguin_data:
