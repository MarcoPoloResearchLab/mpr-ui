services:
  frontend:
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      apple-provider:
        condition: service_healthy
      tauth:
        condition: service_started
    environment:
      GHTTP_SERVE_PORT: "8000"
      GHTTP_SERVE_DIRECTORY: "/app/www"
      GHTTP_SERVE_PROXIES: "/auth=http://tauth:8080,/apple-provider=http://apple-provider:8090"
    ports:
      - "4443:8000"
    volumes:
      - ./:/app/www:ro
    restart: unless-stopped

  apple-provider:
    build:
      context: ./demo/apple-provider
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/apple-provider/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: unless-stopped

  tauth:
    image: ghcr.io/tyemirov/tauth:latest
    pull_policy: always
    depends_on:
      apple-provider:
        condition: service_healthy
    env_file:
      - ./demo/.env.tauth
    environment:
      TAUTH_CORS_ORIGIN_1: "http://localhost:4443"
      TAUTH_CORS_ORIGIN_2: "http://127.0.0.1:4443"
      TAUTH_CORS_ORIGIN_3: "http://computercat.tyemirov.net:4443"
      TAUTH_ALLOW_INSECURE_HTTP: "true"
      TAUTH_APPLE_PRIVATE_KEY_BASE64: ""
      TAUTH_PASSWORD_USER_EMAIL: "demo@mprlab.local"
      TAUTH_PASSWORD_HASH: "$$2y$$12$$UihC9c7inwl90d3iKzlH3OPsrJn2OIGhgAT/TkOHbcueVdNrkf0zS"
    ports:
      - "8080:8080"
    volumes:
      - tauth_data:/data
      - ./demo/tauth-config.yaml:/config.yaml:ro
    restart: unless-stopped

volumes:
  tauth_data:
