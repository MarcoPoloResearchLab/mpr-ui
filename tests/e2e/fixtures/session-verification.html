<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session verification fixture</title>
    <script>
      window.localStorage.clear();
      window.localStorage.setItem(
        "tauth.restore.v1:https%3A%2F%2Fauth.fixture.test:fixture-tenant",
        "1",
      );
      window.fixtureAuthEvents = [];
      [
        "mpr-ui:auth:authenticated",
        "mpr-ui:auth:unauthenticated",
        "mpr-ui:auth:error",
        "mpr-ui:auth:status-change",
      ].forEach(function observeAuthEvent(eventName) {
        document.addEventListener(eventName, function recordAuthEvent(event) {
          window.fixtureAuthEvents.push({
            type: event.type,
            detail: event.detail || null,
          });
        });
      });
    </script>
  </head>
  <body>
    <mpr-login-button
      id="auth-controller"
      auth-config='{"tauthUrl":"https://auth.fixture.test","tenantId":"fixture-tenant","logoutPath":"/auth/logout","sessionPath":"/auth/session","providers":{"google":{"enabled":false},"apple":{"enabled":true,"startPath":"/auth/apple/start","returnTo":"current-origin","label":"Sign in with Apple"},"password":{"enabled":false}}}'
    ></mpr-login-button>
    <script src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.js"></script>
  </body>
</html>
