<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Provider Chooser Fixture</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.css"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(100% - 2rem, 24rem);
      }

      #event-log {
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.8rem;
        color: #cbd5f5;
      }
    </style>
    <script
      id="mpr-ui-bundle"
      defer
      src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.js"
    ></script>
  </head>
  <body>
    <main>
      <mpr-auth-provider-chooser
        id="provider-chooser"
        providers='["apple","google","email"]'
      ></mpr-auth-provider-chooser>
      <ol id="event-log" aria-label="Provider event log"></ol>
    </main>
    <script>
      const eventLog = document.querySelector('#event-log');
      function appendEventLogEntry(event) {
        const item = document.createElement('li');
        item.setAttribute('data-test', 'provider-event-log-entry');
        item.textContent = event.type + ' ' + JSON.stringify(event.detail);
        eventLog.appendChild(item);
      }
      document.addEventListener('mpr-auth-provider:select', appendEventLogEntry);
      document.addEventListener('mpr-auth-provider:email-submit', appendEventLogEntry);
      document.addEventListener('mpr-auth-provider:email-mode', appendEventLogEntry);
    </script>
  </body>
</html>
