# mpr-ui client configuration
# This file is loaded by mpr-ui-config.js and applies the canonical auth provider map.
# Each environment is matched by window.location.origin; exactly one must match at runtime.

environments:
  # Local development with gHTTP serving the repository root over HTTPS.
  - description: "Local TAuth demo"
    origins:
      - "https://localhost:4443"
      - "https://127.0.0.1:4443"
      - "https://computercat.tyemirov.net:4443"
    auth:
      # Empty string means the auth endpoints are same-origin via gHTTP proxy.
      tauthUrl: ""
      tenantId: "mpr-sites"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: true
          clientId: "991677581607-r0dj8q6irjagipali0jpca7nfp8sfj9r.apps.googleusercontent.com"
          loginPath: "/auth/google"
          noncePath: "/auth/nonce"
        apple:
          enabled: false
        password:
          enabled: true
      password:
        loginPath: "/auth/password/login"
        signupPath: "/auth/password/signup"
        verifyEmailPath: "/auth/password/verify-email"
        resetStartPath: "/auth/password/reset/start"
        resetCompletePath: "/auth/password/reset/complete"
      account:
        passwordChangePath: "/auth/account/password/change"
        passwordLinkStartPath: "/auth/account/password/link/start"
        passwordLinkVerifyPath: "/auth/account/password/link/verify"
        googleLinkPath: "/auth/account/google/link"
        unlinkPath: "/auth/account/unlink"
        disablePath: "/auth/account/disable"

  # Lightweight no-store static preview served with `npm run demo:serve`.
  # This origin renders the demo chrome and components; authenticated sign-in still requires `./up.sh tauth`.
  - description: "Static HTTP preview"
    origins:
      - "http://127.0.0.1:4177"
      - "http://localhost:4177"
    auth:
      tauthUrl: ""
      tenantId: "mpr-sites"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: true
          clientId: "991677581607-r0dj8q6irjagipali0jpca7nfp8sfj9r.apps.googleusercontent.com"
          loginPath: "/auth/google"
          noncePath: "/auth/nonce"
        apple:
          enabled: true
          startPath: "/auth/apple/start"
          returnTo: "current-origin"
          label: "Sign in with Apple"
        password:
          enabled: true
      password:
        loginPath: "/auth/password/login"
        signupPath: "/auth/password/signup"
        verifyEmailPath: "/auth/password/verify-email"
        resetStartPath: "/auth/password/reset/start"
        resetCompletePath: "/auth/password/reset/complete"
      account:
        passwordChangePath: "/auth/account/password/change"
        passwordLinkStartPath: "/auth/account/password/link/start"
        passwordLinkVerifyPath: "/auth/account/password/link/verify"
        googleLinkPath: "/auth/account/google/link"
        unlinkPath: "/auth/account/unlink"
        disablePath: "/auth/account/disable"

  # Contract-only local origin for an Apple-only tenant profile.
  - description: "Apple-only local profile"
    origins:
      - "http://127.0.0.1:4178"
      - "http://localhost:4178"
    auth:
      tauthUrl: ""
      tenantId: "mpr-sites"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: false
        apple:
          enabled: true
          startPath: "/auth/apple/start"
          returnTo: "current-origin"
          label: "Sign in with Apple"
        password:
          enabled: false
