mprlab_resources:
    artifacts:
        asset_sets:
            - assets:
                - mpr-ui-config.js
                - mpr-ui.js
                - mpr-ui.css
              id: browser-assets
        web_bundles:
            - format: directory
              id: demo-site
              source:
                context: .
                dockerfile: Dockerfile.pages
                kind: container
    environment:
        private_inputs:
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: mpr-ui-apple-private-key
              variable: MPR_UI_APPLE_PRIVATE_KEY
            - id: mpr-ui-email-delivery-api-key
              variable: MPR_UI_EMAIL_DELIVERY_API_KEY
            - id: mpr-ui-google-web-client-id
              variable: MPR_UI_GOOGLE_WEB_CLIENT_ID
            - id: mpr-ui-jwt-signing-key
              variable: MPR_UI_JWT_SIGNING_KEY
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - env
                - CI=1
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 5m
                request: 30s
                shutdown: 30s
                startup: 2m
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: app-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: app-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
        private_inputs:
            operations: []
    owner: mpr-ui
    publications:
        git:
            assets:
                - artifact: browser-assets
                  id: browser-assets
                  repository: MarcoPoloResearchLab/mpr-ui
        github_pages:
            sites:
                - artifact: demo-site
                  branch: gh-pages
                  domain: ui.mprlab.com
                  id: demo-site
                  marker:
                    path: /.mprlab-release.json
                  repository: MarcoPoloResearchLab/mpr-ui
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        github_pages:
            sites:
                - id: demo-site
                  publication: demo-site
                  url: https://ui.mprlab.com/
        jsdelivr:
            distributions:
                - aliases:
                    - latest
                    - major
                  id: browser-assets
                  publication: browser-assets
